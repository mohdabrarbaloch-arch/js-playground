<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="dark" />
<title>JS Playground — vanilla JavaScript, in your browser</title>
<meta name="description" content="A browser-based JavaScript playground: split-pane editor and console, sandboxed Web Worker runner, snippet library, execution timing and heap stats." />
<style>
  :root {
    --bg: #090c12;
    --panel: #0f141d;
    --panel-2: #131924;
    --panel-3: #18202d;
    --line: #1e2735;
    --line-2: #2a3547;
    --fg: #e2e8f2;
    --fg-2: #b0bccd;
    --muted: #78869c;
    --amber: #ffb454;
    --amber-soft: rgba(255, 180, 84, 0.12);
    --teal: #56d1c3;
    --green: #7ee787;
    --red: #ff6b78;
    --yellow: #ffd166;
    --blue: #79b8ff;
    --pink: #f38ba8;
    --mono: "JetBrains Mono", "SF Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --lh: 22px;
    --fs: 13px;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: var(--sans);
    font-size: 14px;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  ::selection { background: rgba(86, 209, 195, 0.28); }

  .app {
    height: 100dvh;
    display: flex;
    flex-direction: column;
    min-width: 0;
  }

  /* ---------- top bar ---------- */
  .topbar {
    flex: none;
    height: 58px;
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 0 14px 0 16px;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
    min-width: 0;
  }
  .brand { display: flex; align-items: center; gap: 11px; min-width: 0; }
  .logo {
    width: 34px; height: 34px; flex: none;
    display: grid; place-items: center;
    border-radius: 9px;
    background: var(--amber);
    color: #21160a;
    font: 700 15px/1 var(--mono);
    letter-spacing: -1px;
    box-shadow: inset 0 -2px 0 rgba(0, 0, 0, 0.18);
  }
  .brand-text { min-width: 0; }
  .brand-text h1 {
    margin: 0;
    font-size: 14.5px;
    font-weight: 650;
    letter-spacing: 0.2px;
    white-space: nowrap;
  }
  .brand-text p {
    margin: 2px 0 0;
    font-size: 11.5px;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .topbar-actions {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
  }

  .pill {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    height: 30px;
    padding: 0 11px;
    border: 1px solid var(--line-2);
    border-radius: 999px;
    background: var(--panel-2);
    color: var(--fg-2);
    font: 11.5px/1 var(--mono);
    cursor: pointer;
    white-space: nowrap;
    transition: border-color .15s, color .15s, background .15s;
  }
  .pill:hover { border-color: #3a4860; color: var(--fg); background: var(--panel-3); }
  .pill .dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--green);
    box-shadow: 0 0 8px rgba(126, 231, 135, 0.55);
  }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    height: 34px;
    padding: 0 13px;
    border-radius: 9px;
    border: 1px solid var(--line-2);
    background: var(--panel-2);
    color: var(--fg-2);
    font-size: 12.5px;
    font-weight: 550;
    cursor: pointer;
    white-space: nowrap;
    transition: background .15s, border-color .15s, color .15s, transform .08s;
  }
  .btn:hover { background: var(--panel-3); border-color: #3a4860; color: var(--fg); }
  .btn:active { transform: translateY(1px); }
  .btn:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }

  .btn.run {
    background: var(--amber);
    border-color: #ffc274;
    color: #241708;
    font-weight: 700;
    padding: 0 12px 0 14px;
    box-shadow: inset 0 -2px 0 rgba(0, 0, 0, 0.16);
  }
  .btn.run:hover { background: #ffc272; border-color: #ffd39a; color: #241708; }
  .btn.run.stop {
    background: #2a1418;
    border-color: #54252c;
    color: #ff9aa4;
  }
  .btn.run.stop:hover { background: #351a1f; color: #ffb4bb; }
  .btn.run .run-icon { font-size: 10px; line-height: 1; }
  .btn.run .kbd-hint {
    margin-left: 3px;
    padding-left: 8px;
    border-left: 1px solid rgba(36, 23, 8, 0.25);
    font: 600 10.5px/1 var(--mono);
    opacity: .7;
  }
  .btn.run.stop .kbd-hint { display: none; }

  .ghost { background: transparent; }
  .icon-btn {
    width: 30px; height: 30px; padding: 0;
    display: grid; place-items: center;
    border-radius: 8px;
    border: 1px solid transparent;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    font-size: 13px;
  }
  .icon-btn:hover { background: var(--panel-3); color: var(--fg); border-color: var(--line-2); }

  /* ---------- workspace ---------- */
  .workspace {
    flex: 1 1 auto;
    display: flex;
    min-height: 0;
    min-width: 0;
  }

  .pane {
    display: flex;
    flex-direction: column;
    min-height: 0;
    min-width: 0;
    background: var(--panel);
    overflow: hidden;
  }
  .pane-head {
    flex: none;
    height: 40px;
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 0 10px 0 13px;
    border-bottom: 1px solid var(--line);
    background: var(--panel-2);
    min-width: 0;
  }
  .pane-title {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: var(--fg-2);
    white-space: nowrap;
    flex: none;
  }
  .pane-sub {
    font-size: 11.5px;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    min-width: 0;
  }
  .pane-head .spacer { flex: 1 1 auto; min-width: 4px; }

  /* ---------- sidebar ---------- */
  .sidebar {
    flex: none;
    width: 236px;
    display: flex;
    flex-direction: column;
    min-height: 0;
    background: var(--panel);
    border-right: 1px solid var(--line);
  }
  .sidebar-head { padding: 12px 12px 8px; }
  .sidebar-head h2 {
    margin: 0 0 9px;
    font-size: 10.5px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 700;
  }
  .search {
    width: 100%;
    height: 30px;
    padding: 0 9px;
    border-radius: 8px;
    border: 1px solid var(--line-2);
    background: var(--panel-2);
    color: var(--fg);
    font-size: 12px;
    outline: none;
  }
  .search::placeholder { color: #5f6c80; }
  .search:focus { border-color: var(--teal); background: var(--panel-3); }

  .snip-list {
    flex: 1 1 auto;
    overflow-y: auto;
    padding: 2px 8px 12px;
    scrollbar-width: thin;
    scrollbar-color: #2b3547 transparent;
  }
  .snip-group {
    margin: 10px 4px 5px;
    font-size: 9.5px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #5d6a7e;
    font-weight: 700;
  }
  .snip {
    display: block;
    width: 100%;
    text-align: left;
    padding: 8px 9px;
    margin-bottom: 2px;
    border: 1px solid transparent;
    border-radius: 8px;
    background: transparent;
    color: var(--fg-2);
    cursor: pointer;
    position: relative;
    transition: background .13s, color .13s, border-color .13s;
  }
  .snip:hover { background: var(--panel-2); color: var(--fg); }
  .snip.active {
    background: var(--panel-3);
    border-color: var(--line-2);
    color: var(--fg);
  }
  .snip.active::before {
    content: "";
    position: absolute;
    left: 0; top: 9px; bottom: 9px;
    width: 2px;
    border-radius: 2px;
    background: var(--amber);
  }
  .snip-name {
    display: block;
    font-size: 12.5px;
    font-weight: 550;
    line-height: 1.35;
    padding-left: 2px;
  }
  .snip-meta {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 4px;
    padding-left: 2px;
    font: 10px/1 var(--mono);
    color: var(--muted);
  }
  .tag {
    padding: 2px 5px;
    border-radius: 4px;
    background: var(--panel-2);
    border: 1px solid var(--line);
    letter-spacing: 0.04em;
  }
  .snip.active .tag { background: rgba(255, 255, 255, 0.04); }
  .t-scope { color: var(--amber); }
  .t-async { color: var(--teal); }
  .t-data { color: var(--blue); }
  .t-runtime { color: var(--green); }
  .t-syntax { color: var(--pink); }
  .t-pitfall { color: var(--red); }

  .sidebar-foot {
    flex: none;
    padding: 10px 12px;
    border-top: 1px solid var(--line);
    font-size: 10.5px;
    line-height: 1.7;
    color: var(--muted);
  }
  .sidebar-foot kbd {
    display: inline-block;
    padding: 1px 5px;
    border: 1px solid var(--line-2);
    border-bottom-width: 2px;
    border-radius: 4px;
    background: var(--panel-2);
    font: 10px/1.4 var(--mono);
    color: var(--fg-2);
  }

  /* ---------- editor ---------- */
  .editor-pane { flex: 1 1 auto; }
  .editor-shell {
    flex: 1 1 auto;
    display: flex;
    min-height: 0;
    position: relative;
    background: var(--panel);
  }
  .gutter {
    flex: none;
    width: 46px;
    padding: 12px 0;
    overflow: hidden;
    border-right: 1px solid var(--line);
    background: #0c1119;
    user-select: none;
  }
  .gutter-inner { will-change: transform; }
  .ln {
    height: var(--lh);
    line-height: var(--lh);
    padding-right: 10px;
    text-align: right;
    font: var(--fs)/var(--lh) var(--mono);
    color: #414e63;
    transition: color .1s;
  }
  .ln.active { color: var(--fg-2); }
  .ln.err { color: #ffb3ba; background: rgba(255, 107, 120, 0.1); }

  .code-wrap { flex: 1 1 auto; position: relative; min-width: 0; overflow: hidden; }
  .hl, #code {
    margin: 0;
    font: var(--fs)/var(--lh) var(--mono);
    tab-size: 2;
    letter-spacing: 0;
    white-space: pre;
    word-spacing: normal;
  }
  .hl {
    position: absolute;
    inset: 0;
    padding: 0;
    overflow: hidden;
    pointer-events: none;
    color: var(--fg);
  }
  .hl-inner {
    display: block;
    padding: 12px 16px 40px;
    will-change: transform;
  }
  #code {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    padding: 12px 16px 40px;
    border: 0;
    resize: none;
    outline: none;
    background: transparent;
    color: transparent;
    caret-color: var(--amber);
    overflow: auto;
    scrollbar-width: thin;
    scrollbar-color: #2b3547 transparent;
  }
  #code::-webkit-scrollbar { width: 10px; height: 10px; }
  #code::-webkit-scrollbar-thumb { background: #2b3547; border-radius: 6px; border: 2px solid var(--panel); }
  #code::-webkit-scrollbar-corner { background: transparent; }

  /* syntax colours */
  .kw { color: #ff9ec7; }
  .lit { color: #ffb454; }
  .num { color: #c3a6ff; }
  .str { color: #9ee493; }
  .cm { color: #5d6b7f; font-style: italic; }
  .bi { color: #6fc3ff; }
  .fn { color: #ffd48a; }
  .prop { color: #9fd3ff; }
  .punc { color: #91a0b6; }

  /* ---------- splitter ---------- */
  .splitter {
    flex: none;
    width: 7px;
    cursor: col-resize;
    background: var(--bg);
    border-left: 1px solid var(--line);
    border-right: 1px solid var(--line);
    position: relative;
    touch-action: none;
  }
  .splitter::after {
    content: "";
    position: absolute;
    top: 50%; left: 50%;
    width: 3px; height: 34px;
    transform: translate(-50%, -50%);
    border-radius: 2px;
    background: #2c3749;
    transition: background .15s, height .15s;
  }
  .splitter:hover::after { background: var(--amber); height: 52px; }
  body.dragging { cursor: col-resize; user-select: none; }
  body.dragging .splitter::after { background: var(--amber); }

  /* ---------- console ---------- */
  .console-pane {
    flex: none;
    width: 440px;
    min-width: 260px;
    max-width: 70%;
    background: #0b1017;
  }
  .console-pane .pane-head { background: var(--panel-2); }
  .console-body {
    flex: 1 1 auto;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 4px 0 26px;
    scrollbar-width: thin;
    scrollbar-color: #2b3547 transparent;
    font: 12.6px/1.62 var(--mono);
  }
  .console-body::-webkit-scrollbar { width: 10px; }
  .console-body::-webkit-scrollbar-thumb { background: #2b3547; border-radius: 6px; border: 2px solid #0b1017; }

  .empty {
    padding: 26px 18px;
    color: var(--muted);
    font: 12px/1.75 var(--mono);
  }
  .empty b { color: var(--fg-2); font-weight: 600; display: block; margin-bottom: 6px; font-family: var(--sans); font-size: 12.5px; }
  .empty code { color: var(--amber); }

  .run-head {
    display: flex;
    align-items: center;
    gap: 9px;
    margin: 12px 12px 6px;
    color: #5f6d81;
    font: 10px/1 var(--mono);
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }
  .run-head::after { content: ""; flex: 1 1 auto; height: 1px; background: var(--line); }
  .run-head .n { color: var(--fg-2); }

  .entry {
    display: flex;
    gap: 8px;
    padding: 2px 14px 2px 10px;
    border-left: 2px solid transparent;
    animation: fade .16s ease-out;
  }
  @keyframes fade { from { opacity: 0; transform: translateY(2px); } to { opacity: 1; transform: none; } }
  .entry .marker {
    flex: none;
    width: 11px;
    text-align: center;
    color: #4b5a70;
    user-select: none;
  }
  .entry .body {
    flex: 1 1 auto;
    min-width: 0;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    color: #c9d3e2;
  }
  .entry.info .marker { color: var(--blue); }
  .entry.warn { border-left-color: #574414; background: rgba(255, 209, 102, 0.045); }
  .entry.warn .marker { color: var(--yellow); }
  .entry.warn .body { color: #ffe1a0; }
  .entry.error { border-left-color: #5c2229; background: rgba(255, 107, 120, 0.06); }
  .entry.error .marker { color: var(--red); }
  .entry.error .body { color: #ffb6bd; }
  .entry.table .body { color: #c2d4e6; }
  .entry.result {
    margin-top: 2px;
    border-left-color: #24524c;
    background: rgba(86, 209, 195, 0.05);
  }
  .entry.result .marker { color: var(--teal); }
  .entry.result .body { color: #9ff0e4; }
  .entry.result .body .kind {
    color: #4e8b84;
    margin-right: 6px;
    font-size: 10.5px;
    letter-spacing: 0.04em;
  }
  .entry.sys .body { color: #8695ab; }
  .entry .stack {
    display: block;
    margin-top: 4px;
    color: #8a7080;
    font-size: 11.4px;
    line-height: 1.55;
  }

  .summary {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
    margin: 6px 12px 4px;
    padding: 6px 10px;
    border-radius: 7px;
    border: 1px solid var(--line);
    background: var(--panel-2);
    font: 10.5px/1 var(--mono);
    color: var(--muted);
  }
  .summary .ok { width: 6px; height: 6px; border-radius: 50%; background: var(--green); box-shadow: 0 0 6px rgba(126, 231, 135, .5); }
  .summary .bad { width: 6px; height: 6px; border-radius: 50%; background: var(--red); }
  .summary b { color: var(--fg-2); font-weight: 600; }
  .summary .sep { color: #3a475a; }

  .late-tag {
    display: inline-block;
    margin-right: 6px;
    padding: 1px 4px;
    border-radius: 3px;
    background: rgba(255, 180, 84, 0.1);
    color: #b98849;
    font-size: 9.5px;
    letter-spacing: 0.06em;
    vertical-align: 1px;
  }

  .mini-select {
    height: 24px;
    padding: 0 6px;
    border-radius: 6px;
    border: 1px solid var(--line-2);
    background: var(--panel-3);
    color: var(--fg-2);
    font: 10.5px/1 var(--mono);
    outline: none;
    cursor: pointer;
  }
  .mini-select:focus { border-color: var(--teal); }

  .chip {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    height: 22px;
    padding: 0 7px;
    border-radius: 5px;
    border: 1px solid var(--line);
    background: var(--panel-3);
    color: var(--fg-2);
    font: 10.5px/1 var(--mono);
    white-space: nowrap;
  }
  .chip.now { color: var(--amber); border-color: #4a3a22; background: #221a10; }
  .chip.bad { color: #ffa7b0; border-color: #4d2127; background: #221216; }

  .live-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--amber);
    animation: pulse 1s infinite ease-in-out;
  }
  @keyframes pulse { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }

  /* ---------- status bar ---------- */
  .statusbar {
    flex: none;
    height: 28px;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 12px;
    background: var(--panel);
    border-top: 1px solid var(--line);
    font: 10.5px/1 var(--mono);
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
  }
  .statusbar .sb { display: inline-flex; align-items: center; gap: 6px; }
  .statusbar .grow { flex: 1 1 auto; }
  .statusbar .v { color: var(--fg-2); }
  .statusbar .dot-sep { color: #334052; }

  /* ---------- env popover ---------- */
  .popwrap { position: relative; }
  .popover {
    position: absolute;
    top: calc(100% + 8px);
    right: 0;
    width: 290px;
    padding: 12px;
    border-radius: 11px;
    border: 1px solid var(--line-2);
    background: #10161f;
    box-shadow: 0 18px 40px rgba(0, 0, 0, 0.55);
    z-index: 60;
    display: none;
  }
  .popover.open { display: block; }
  .popover h3 {
    margin: 0 0 9px;
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 700;
  }
  .popover .row {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    padding: 4px 0;
    border-bottom: 1px dashed #1a222e;
    font: 11px/1.5 var(--mono);
  }
  .popover .row:last-child { border-bottom: 0; }
  .popover .row span:first-child { color: var(--muted); }
  .popover .row span:last-child { color: var(--fg-2); text-align: right; overflow-wrap: anywhere; }
  .popover .note {
    margin: 9px 0 0;
    font: 10.5px/1.6 var(--mono);
    color: #5f6d81;
  }

  .mobile-only { display: none; }

  /* ---------- responsive ---------- */
  @media (max-width: 1080px) {
    .console-pane { width: 380px; }
    .sidebar { width: 208px; }
  }
  @media (max-width: 900px) {
    .topbar { height: 54px; gap: 10px; }
    .brand-text p { display: none; }
    .pill { display: none; }
    .workspace { flex-direction: column; }
    .sidebar { display: none; }
    .splitter { display: none; }
    .editor-pane { flex: 1 1 55%; min-height: 180px; }
    .console-pane {
      flex: 1 1 45%;
      width: auto;
      max-width: none;
      min-width: 0;
      min-height: 160px;
      border-top: 1px solid var(--line-2);
    }
    .mobile-only { display: inline-flex; }
    .gutter { width: 38px; }
    .ln { padding-right: 7px; }
    .statusbar .hide-sm { display: none; }
  }
  @media (max-width: 560px) {
    .brand-text h1 { font-size: 13px; }
    .btn { padding: 0 10px; font-size: 12px; }
    .btn.run .kbd-hint { display: none; }
    .pane-sub { display: none; }
    .console-body { font-size: 12px; }
  }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <div class="logo">{ }</div>
      <div class="brand-text">
        <h1>JS Playground</h1>
        <p>Vanilla JavaScript · executed in a sandboxed Web Worker</p>
      </div>
    </div>
    <div class="topbar-actions">
      <div class="popwrap">
        <button class="pill" id="envBtn" aria-haspopup="true" aria-expanded="false" title="Engine &amp; runtime details">
          <span class="dot"></span><span id="engineLabel">detecting…</span>
        </button>

    var blockEnd = nextNl === -1 ? val.length : nextNl;
    var lines = val.slice(blockStart, blockEnd).split("\n");
    var allCommented = lines.every(function (l) { return !l.trim() || /^\s*\/\//.test(l); });
    var changed = lines.map(function (l) {
      if (!l.trim()) return l;
      if (allCommented) return l.replace(/^(\s*)\/\/ ?/, "$1");
      return l.replace(/^(\s*)/, "$1// ");
    });
    var text = changed.join("\n");
    var delta = text.length - (blockEnd - blockStart);
    replaceRange(blockStart, blockEnd, text, Math.max(blockStart, start + (allCommented ? -3 : 3)));
    ta.setSelectionRange(Math.max(blockStart, start + (allCommented ? -3 : 3)),
      Math.max(blockStart, end + delta));
    syncAll();
  }

  ta.addEventListener("input", syncAll);
  ta.addEventListener("scroll", syncScroll);
  ta.addEventListener("click", function () { updateStatus(); renderGutter(); });
  ta.addEventListener("keyup", function (e) {
    if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Home", "End", "PageUp", "PageDown"].indexOf(e.key) !== -1) {
      updateStatus();
      renderGutter();
    }
  });

  $("formatBtn").addEventListener("click", function () {
    // Re-indent: 2 spaces per brace depth, keeping blank lines and strings intact.
    var lines = ta.value.split("\n");
    var depth = 0;
    var out = lines.map(function (line) {
      var trimmed = line.trim();
      if (!trimmed) return "";
      var lead = 0;
      if (/^[}\])]/.test(trimmed)) lead = 1;
      var target = Math.max(0, depth - lead);
      var opens = (trimmed.match(/[{\[(]/g) || []).length;
      var closes = (trimmed.match(/[}\])]/g) || []).length;
      depth = Math.max(0, depth + opens - closes);
      return new Array(target + 1).join("  ") + trimmed;
    });
    replaceRange(0, ta.value.length, out.join("\n"), 0);
    toast("Re-indented " + out.length + " lines");
  });

  /* =========================================================
     Console UI
     ========================================================= */
  var autoScroll = true;
  consoleBody.addEventListener("scroll", function () {
    autoScroll = consoleBody.scrollTop + consoleBody.clientHeight >= consoleBody.scrollHeight - 30;
  });

  function scrollDown() {
    if (autoScroll) consoleBody.scrollTop = consoleBody.scrollHeight;
  }

  function clearConsole(showWelcome) {
    consoleBody.innerHTML = "";
    autoScroll = true;
    state.runCount = 0;
    if (showWelcome !== false) {
      var box = document.createElement("div");
      box.className = "empty";
      box.innerHTML =
        "<b>Sandboxed runner ready.</b>" +
        "Every run happens in a throw-away Web Worker, so an infinite loop cannot freeze this page.<br /><br />" +
        "Press <code>Ctrl</code> + <code>Enter</code> to run · <code>console.log()</code> prints here.";
      consoleBody.appendChild(box);
    }
    timeChip.textContent = "— ms";
    timeChip.className = "chip";
  }

  function clearEmpty() {
    var empty = consoleBody.querySelector(".empty");
    if (empty) empty.remove();
  }

  function addEntry(level, text, opts) {
    clearEmpty();
    opts = opts || {};
    var row = document.createElement("div");
    row.className = "entry " + level;
    var marker = document.createElement("span");
    marker.className = "marker";
    marker.textContent = level === "error" ? "✕" : level === "warn" ? "!" : level === "result" ? "⟵" : level === "info" ? "i" : "›";
    var body = document.createElement("span");
    body.className = "body";
    if (opts.indent) body.style.paddingLeft = (opts.indent * 13) + "px";
    if (opts.late) {
      var tag = document.createElement("span");
      tag.className = "late-tag";
      tag.textContent = "async";
      body.appendChild(tag);
    }
    body.appendChild(document.createTextNode(text));
    if (opts.stack && opts.stack.length) {
      var st = document.createElement("span");
      st.className = "stack";
      st.textContent = opts.stack.join("\n");
      body.appendChild(st);
    }
    row.appendChild(marker);
    row.appendChild(body);
    consoleBody.appendChild(row);
    scrollDown();
    return row;
  }

  function addRunHead(n) {
    clearEmpty();
    var head = document.createElement("div");
    head.className = "run-head";
    head.innerHTML = "<span>run <span class='n'>#" + n + "</span></span>";
    consoleBody.appendChild(head);
    autoScroll = true;
    scrollDown();
  }

  function addSummary(data) {
    var s = document.createElement("div");
    s.className = "summary";
    var dot = document.createElement("span");
    dot.className = data.error ? "bad" : "ok";
    var bits = [];
    bits.push("<b>" + data.duration.toFixed(1) + " ms</b>");
    if (data.counts) {
      bits.push(data.counts.log + " log" + (data.counts.log === 1 ? "" : "s"));
      if (data.counts.warn) bits.push(data.counts.warn + " warning" + (data.counts.warn === 1 ? "" : "s"));
      if (data.counts.error) bits.push(data.counts.error + " error" + (data.counts.error === 1 ? "" : "s"));
    }
    s.appendChild(dot);
    s.insertAdjacentHTML("beforeend", "<span>" + bits.join(" <span class='sep'>·</span> ") + "</span>");
    consoleBody.appendChild(s);
    scrollDown();
  }

  function addError(err) {
    var title = err.name + ": " + err.message;
    var stack = [];
    if (err.line) stack.push("at line " + err.line + (err.column ? ":" + err.column : "") + " of your snippet");
    if (err.stack && err.stack.length) {
      err.stack.slice(0, 3).forEach(function (f) { if (!/^at line /.test(f)) stack.push(f); });
    }
    addEntry("error", title, { stack: stack });
  }

  function addResult(text, kind) {
    var row = addEntry("result", "", {});
    var body = row.querySelector(".body");
    var kindEl = document.createElement("span");
    kindEl.className = "kind";
    kindEl.textContent = kind || "value";
    body.appendChild(kindEl);
    body.appendChild(document.createTextNode(text));
    scrollDown();
  }

  function toast(msg) {
    var el = document.createElement("div");
    el.textContent = msg;
    el.style.cssText = "position:fixed;left:50%;bottom:44px;transform:translateX(-50%);padding:7px 13px;" +
      "border-radius:8px;background:#1b2331;border:1px solid #2b3547;color:#c9d3e2;font:11.5px var(--mono);" +
      "z-index:99;pointer-events:none;opacity:0;transition:opacity .18s";
    document.body.appendChild(el);
    requestAnimationFrame(function () { el.style.opacity = "1"; });
    setTimeout(function () {
      el.style.opacity = "0";
      setTimeout(function () { el.remove(); }, 220);
    }, 1300);
  }

  /* =========================================================
     Runner
     ========================================================= */
  var workerUrl = null;
  function getWorkerUrl() {
    if (!workerUrl) {
      workerUrl = URL.createObjectURL(new Blob([WORKER_SRC], { type: "text/javascript" }));
    }
    return workerUrl;
  }

  function setRunning(on) {
    state.running = on;
    runBtn.classList.toggle("stop", on);
    runIcon.textContent = on ? "■" : "▶";
    runLabel.textContent = on ? "Stop" : "Run";
    liveDot.style.display = on ? "inline-block" : "none";
  }

  function stopRun(silent) {
    if (state.worker) {
      try { state.worker.terminate(); } catch (e) { /* ignore */ }
      state.worker = null;
    }
    clearTimeout(state.timeout);
    if (!silent) {
      addEntry("error", "Execution stopped.");
      setRunning(false);
    }
    liveDot.style.display = "none";
  }

  function execTimeout() {
    var v = parseInt(limitSel.value, 10);
    return isNaN(v) ? 5000 : v;
  }

  function run() {
    if (state.running) { stopRun(); return; }
    var code = ta.value;
    if (!code.trim()) { toast("Nothing to run"); return; }

    state.runCount++;
    var runId = state.runCount;
    setRunning(true);
    state.errorLine = null;
    renderGutter();

    var body = consoleBody;
    addRunHead(runId);

    var startedWall = performance.now();
    var finished = false;
    var worker;
    try {
      worker = new Worker(getWorkerUrl());
    } catch (err) {
      addEntry("error", "Could not start the sandbox worker: " + err.message);
      setRunning(false);
      return;
    }
    state.worker = worker;

    var limit = execTimeout();
    state.timeout = setTimeout(function () {
      if (finished) return;
      finished = true;
      try { worker.terminate(); } catch (e) { /* ignore */ }
      state.worker = null;
      addEntry("error", "Execution timed out after " + (limit / 1000) + "s — the worker was terminated (infinite loop?).");
      addSummary({ duration: performance.now() - startedWall, counts: { log: 0, warn: 0, error: 1 }, error: true });
      timeChip.textContent = "timeout";
      timeChip.className = "chip bad";
      setRunning(false);
    }, limit);

    worker.onmessage = function (event) {
      var msg = event.data || {};
      if (!msg.__pg) return;

      if (msg.type === "log") {
        var d = msg.data;
        addEntry(d.level || "log", d.parts && d.parts.length ? d.parts.join(" ") : " ", { indent: d.indent, late: d.late });
        return;
      }
      if (msg.type === "clear") {
        clearConsole(false);
        return;
      }
      if (msg.type === "done") {
        if (finished) return;
        finished = true;
        clearTimeout(state.timeout);
        var data = msg.data;
        addSummary(data);
        if (data.error) {
          addError(data.error);
          state.errorLine = data.error.line || null;
          renderGutter();
          timeChip.textContent = data.duration.toFixed(1) + " ms";
          timeChip.className = "chip bad";
        } else {
          if (data.result && data.result.has) addResult(data.result.text, "return value");
          timeChip.textContent = data.duration.toFixed(1) + " ms";
          timeChip.className = "chip now";
        }
        state.lastDuration = data.duration;
        $("sbRun").textContent = data.duration.toFixed(1) + " ms";
        refreshHeap();
        setRunning(false);
        // Keep the worker alive briefly so late async logs (timers, promises) still land.
        var w = worker;
        setTimeout(function () {
          try { w.terminate(); } catch (e) { /* ignore */ }
          if (state.worker === w) state.worker = null;
        }, 1200);
      }
    };

    worker.onerror = function (event) {
      if (finished) return;
      finished = true;
      clearTimeout(state.timeout);
      var msg = (event && event.message) ? event.message : "Worker crashed";
      addEntry("error", msg, {});
      addSummary({ duration: performance.now() - startedWall, counts: { log: 0, warn: 0, error: 1 }, error: true });
      setRunning(false);
    };

    worker.postMessage({ type: "run", id: runId, code: code });
  }

  runBtn.addEventListener("click", run);

  document.addEventListener("keydown", function (e) {
    var mod = e.ctrlKey || e.metaKey;
    if (mod && e.key === "Enter") {
      e.preventDefault();
      run();
    } else if (mod && (e.key === "l" || e.key === "L")) {
      e.preventDefault();
      clearConsole(true);
    }
  });

  $("clearBtn").addEventListener("click", function () { clearConsole(true); });

  /* =========================================================
     Environment info
     ========================================================= */
  function loadHeap() {
    var m = performance && performance.memory;
    if (!m) return null;
    return { used: m.usedJSHeapSize, total: m.totalJSHeapSize, limit: m.jsHeapSizeLimit };
  }

  function mb(bytes) { return (bytes / 1048576).toFixed(1) + " MB"; }

  function engineInfo() {
    var ua = navigator.userAgent || "";
    var m;
    if ((m = /Firefox\/([\d.]+)/.exec(ua))) return { engine: "SpiderMonkey", browser: "Firefox", version: m[1] };
    if ((m = /Edg\/([\d.]+)/.exec(ua))) return { engine: "V8", browser: "Edge", version: m[1] };
    if ((m = /OPR\/([\d.]+)/.exec(ua))) return { engine: "V8", browser: "Opera", version: m[1] };
    if ((m = /Chrome\/([\d.]+)/.exec(ua))) return { engine: "V8", browser: "Chrome", version: m[1] };
    if ((m = /Version\/([\d.]+).*Safari/.exec(ua))) return { engine: "JavaScriptCore", browser: "Safari", version: m[1] };
    return { engine: "JavaScript", browser: "browser", version: "" };
  }

  function refreshHeap() {
    var h = loadHeap();
    if (h) {
      heapChip.textContent = "heap " + mb(h.used);
      heapChip.title = "V8 JS heap of this page: " + mb(h.used) + " used of " + mb(h.total) + " (limit " + mb(h.limit) + ")";
    } else {
      heapChip.textContent = "heap n/a";
      heapChip.title = "performance.memory is only exposed by Chromium browsers";
    }
  }

  function renderEnv() {
    var info = engineInfo();
    var h = loadHeap();
    var rows = [
      ["JS engine", info.engine + (info.version ? " (" + info.browser + " " + info.version + ")" : "")],
      ["Runner", "Web Worker · fresh context per run"],
      ["CPU cores", navigator.hardwareConcurrency ? String(navigator.hardwareConcurrency) : "unknown"],
      ["Device memory", navigator.deviceMemory ? navigator.deviceMemory + " GB" : "not exposed"],
      ["JS heap", h ? mb(h.used) + " / " + mb(h.limit) : "not exposed"],
      ["Timeout", (execTimeout() / 1000) + "s per run"]
    ];
    var html = "<h3>Runtime</h3>";
    rows.forEach(function (r) {
      html += "<div class='row'><span>" + esc(r[0]) + "</span><span>" + esc(r[1]) + "</span></div>";
    });
    html += "<p class='note'>Code runs in an isolated worker thread with its own global scope, so page state is never touched and runaway loops can be killed.</p>";
    $("envPop").innerHTML = html;
    $("engineLabel").textContent = info.engine + (navigator.hardwareConcurrency ? " · " + navigator.hardwareConcurrency + " cores" : "");
    $("sbEngine").textContent = info.engine + (info.version ? " " + info.version : "");
  }

  $("envPop").addEventListener("click", function (e) { e.stopPropagation(); });

  $("envBtn").addEventListener("click", function (e) {
    e.stopPropagation();
    var pop = $("envPop");
    var open = pop.classList.toggle("open");
    $("envBtn").setAttribute("aria-expanded", open ? "true" : "false");
    if (open) renderEnv();
  });
  document.addEventListener("click", function () {
    $("envPop").classList.remove("open");
    $("envBtn").setAttribute("aria-expanded", "false");
  });
  limitSel.addEventListener("change", function () {
    renderEnv();
    toast("Timeout set to " + (execTimeout() / 1000) + "s");
  });

  /* =========================================================
     Snippet list
     ========================================================= */
  function loadSnippet(id, announce) {
    var snip = null;
    for (var i = 0; i < SNIPPETS.length; i++) if (SNIPPETS[i].id === id) snip = SNIPPETS[i];
    if (!snip) return;
    state.currentId = snip.id;
    ta.value = snip.code;
    state.errorLine = null;
    editorSub.textContent = snip.file;
    $("sbSnippet").textContent = snip.file;
    snipSelect.value = snip.id;
    Array.prototype.forEach.call(snipList.querySelectorAll(".snip"), function (el) {
      el.classList.toggle("active", el.getAttribute("data-id") === snip.id);
    });
    ta.setSelectionRange(0, 0);
    ta.scrollTop = 0;
    syncAll();
    clearConsole(true);
    if (announce) toast("Loaded “" + snip.title + "”");
  }

  function renderSnippets(filter) {
    var q = (filter || "").trim().toLowerCase();
    var groups = {};
    var order = [];
    SNIPPETS.forEach(function (s) {
      var haystack = (s.title + " " + s.blurb + " " + s.tag + " " + s.group).toLowerCase();
      if (q && haystack.indexOf(q) === -1) return;
      if (!groups[s.group]) { groups[s.group] = []; order.push(s.group); }
      groups[s.group].push(s);
    });
    if (!order.length) {
      snipList.innerHTML = "<div class='snip-group' style='text-transform:none;letter-spacing:0'>No match</div>";
      return;
    }
    var html = "";
    order.forEach(function (g) {
      html += "<div class='snip-group'>" + esc(g) + "</div>";
      groups[g].forEach(function (s) {
        html += "<button class='snip" + (s.id === state.currentId ? " active" : "") + "' data-id='" + s.id + "' title='" + esc(s.blurb) + "'>" +
          "<span class='snip-name'>" + esc(s.title) + "</span>" +
          "<span class='snip-meta'><span class='tag t-" + s.tag + "'>" + s.tag + "</span>" +
          "<span>" + s.code.split("\n").length + " lines</span></span>" +
          "</button>";
      });
    });
    snipList.innerHTML = html;
  }

  snipList.addEventListener("click", function (e) {
    var btn = e.target.closest ? e.target.closest(".snip") : null;
    if (!btn) return;
    loadSnippet(btn.getAttribute("data-id"), true);
  });

  snipSearch.addEventListener("input", function () { renderSnippets(snipSearch.value); });

  snipSelect.addEventListener("change", function () { loadSnippet(snipSelect.value, true); });

  /* =========================================================
     Splitter
     ========================================================= */
  (function initSplitter() {
    var drag = false;
    var rect = null;
    splitter.addEventListener("pointerdown", function (e) {
      drag = true;
      rect = document.querySelector(".workspace").getBoundingClientRect();
      document.body.classList.add("dragging");
      try { splitter.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
      e.preventDefault();
    });
    splitter.addEventListener("pointermove", function (e) {
      if (!drag) return;
      var width = rect.right - e.clientX;
      var max = rect.width * 0.7;
      width = Math.max(240, Math.min(width, max));
      consolePane.style.width = width + "px";
      scheduleSave();
    });
    var stop = function () {
      if (!drag) return;
      drag = false;
      document.body.classList.remove("dragging");
    };
    splitter.addEventListener("pointerup", stop);
    splitter.addEventListener("pointercancel", stop);
    window.addEventListener("pointerup", stop);
  })();

  /* =========================================================
     Boot
     ========================================================= */
  function boot() {
    var saved = store.get(KEY, null);

    SNIPPETS.forEach(function (s) {
      var opt = document.createElement("option");
      opt.value = s.id;
      opt.textContent = s.title;
      snipSelect.appendChild(opt);
    });

    if (saved && saved.split) consolePane.style.width = saved.split;

    var startId = (saved && saved.id && SNIPPETS.some(function (s) { return s.id === saved.id; })) ? saved.id : SNIPPETS[0].id;
    loadSnippet(startId, false);
    if (saved && typeof saved.code === "string" && saved.code.trim()) {
      ta.value = saved.code;
      syncAll();
      clearConsole(true);
    }

    renderSnippets("");
    renderEnv();
    refreshHeap();
    clearConsole(true);
    $("sbSaved").textContent = saved ? "restored" : "ready";

    setInterval(refreshHeap, 4000);
    ta.focus();
  }

  boot();
})();
</script>
</body>
</html>
